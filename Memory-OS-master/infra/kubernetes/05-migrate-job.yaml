apiVersion: batch/v1
kind: Job
metadata:
  name: memoryos-migrate
  namespace: memory-os
  labels:
    app: memoryos-api
    component: migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: memoryos-api
        component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: memoryos/api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: memoryos-config
            - secretRef:
                name: memoryos-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
