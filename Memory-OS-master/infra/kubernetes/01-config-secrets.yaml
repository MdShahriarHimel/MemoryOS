apiVersion: v1
kind: ConfigMap
metadata:
  name: memoryos-config
  namespace: memory-os
data:
  MEMORY_OS_API_URL: "http://memoryos-api:8000"
  EMBEDDING_DIM: "1536"
  ENVIRONMENT: "production"
  MEMORY_OS_ALLOW_ANON: "false"
  PROMETHEUS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: memoryos-secrets
  namespace: memory-os
type: Opaque
stringData:
  # Replace via your secrets manager / sealed-secrets. Do NOT commit real values.
  DATABASE_URL: "postgresql+asyncpg://memoryos:CHANGE_ME@postgres:5432/memoryos"
  REDIS_URL: "redis://redis:6379/0"
  NEO4J_URI: "bolt://neo4j:7687"
  OPENSEARCH_URL: "http://opensearch:9200"
  JWT_SECRET: "REPLACE_WITH_32_PLUS_CHAR_SECRET"
  API_KEY_PEPPER: "REPLACE_WITH_32_PLUS_CHAR_PEPPER"
  METRICS_TOKEN: "REPLACE_WITH_METRICS_TOKEN"
