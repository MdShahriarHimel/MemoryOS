apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryos-worker
  namespace: memory-os
spec:
  replicas: 2
  selector:
    matchLabels: { app: memoryos-worker }
  template:
    metadata:
      labels: { app: memoryos-worker }
    spec:
      containers:
        - name: worker
          image: memoryos/worker:latest
          envFrom:
            - configMapRef: { name: memoryos-config }
            - secretRef: { name: memoryos-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
