apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryos-dashboard
  namespace: memory-os
spec:
  replicas: 2
  selector:
    matchLabels: { app: memoryos-dashboard }
  template:
    metadata:
      labels: { app: memoryos-dashboard }
    spec:
      containers:
        - name: dashboard
          image: memoryos/dashboard:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_MEMORY_OS_API_URL
              value: "https://api.memory-os.example.com"
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: memoryos-dashboard
  namespace: memory-os
spec:
  selector: { app: memoryos-dashboard }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memoryos-ingress
  namespace: memory-os
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: app.memory-os.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: memoryos-dashboard, port: { number: 3000 } } }
    - host: api.memory-os.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: memoryos-api, port: { number: 8000 } } }
