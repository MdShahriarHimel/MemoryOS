name: API CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=. python -m pytest -q

  rls-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memoryos
          POSTGRES_PASSWORD: memoryos
          POSTGRES_DB: memoryos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio alembic asyncpg
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://memoryos:memoryos@localhost:5432/memoryos
      - run: PYTHONPATH=. python -m pytest tests/test_rls_postgres.py -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://memoryos:memoryos@localhost:5432/memoryos
