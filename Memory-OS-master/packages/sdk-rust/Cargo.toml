[package]
name = "memoryos"
version = "0.1.0"
edition = "2021"
description = "Official MEMORY OS Rust SDK (model-independent)."

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
