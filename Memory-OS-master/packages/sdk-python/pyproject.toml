[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryos-sdk"
version = "0.3.0"
description = "Official MEMORY OS Python SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memoryos*"]
